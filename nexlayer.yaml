application:
  name: kafka
  pods:
  - name: app
    image: mirror.gcr.io/provectuslabs/kafka-ui:latest
    path: /
    servicePorts:
    - 8080
    vars:
      SERVER_PORT: "8080"
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
